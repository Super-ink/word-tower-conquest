<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词塔征服 · Word Tower Conquest</title>
<style>
@font-face {
  font-family: 'PixelFont';
  src: url('data:font/woff2;base64,') format('woff2');
}
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --accent: #e94560;
  --gold: #f5c518;
  --green: #4ecca3;
  --blue: #0f9b8e;
  --text: #eaeaea;
  --muted: #7f8c8d;
  --hp: #e74c3c;
  --mp: #3498db;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  height: 100dvh; /* dynamic viewport height for mobile browsers */
  image-rendering: pixelated;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.map-container, .rest-area, .deck-browse {
  -webkit-overflow-scrolling: touch;
}
canvas { display: none; }

/* ===== PIXEL ART ENGINE (CSS sprites) ===== */
.pixel-sprite {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ===== SCREENS ===== */
.screen { display:none; width:100%; height:100vh; height:100dvh; position:absolute; top:0; left:0; }
.screen.active { display:flex; }

/* Title Screen */
#title-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #0f0c29, #302b63, #24243e);
}
.title-logo {
  font-size: 48px;
  color: var(--gold);
  text-shadow: 4px 4px 0 #b8860b, 0 0 20px rgba(245,197,24,0.5);
  margin-bottom: 8px;
  letter-spacing: 4px;
  animation: titlePulse 2s ease-in-out infinite;
}
@keyframes titlePulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
.title-sub {
  font-size: 18px;
  color: var(--muted);
  margin-bottom: 40px;
  letter-spacing: 2px;
}
.pixel-btn {
  background: var(--accent);
  color: #fff;
  border: 3px solid #c0392b;
  padding: 12px 36px;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  cursor: pointer;
  position: relative;
  transition: all 0.1s;
  text-transform: uppercase;
  letter-spacing: 2px;
  box-shadow: 4px 4px 0 #7f1d1d;
}
.pixel-btn:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 #7f1d1d;
}
.pixel-btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 #7f1d1d;
}
.pixel-btn.green { background: var(--green); border-color: #2d8a6e; box-shadow: 4px 4px 0 #1a5c47; }
.pixel-btn.green:hover { box-shadow: 2px 2px 0 #1a5c47; }
.pixel-btn.blue { background: var(--blue); border-color: #0a6e65; box-shadow: 4px 4px 0 #054d47; }
.pixel-btn.gold { background: var(--gold); color: #1a1a2e; border-color: #b8860b; box-shadow: 4px 4px 0 #8b6914; }
.pixel-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

/* HUD */
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  background: rgba(0,0,0,0.6);
  border-bottom: 3px solid #333;
  font-size: 14px;
  z-index: 10;
}
.hud-left, .hud-right { display:flex; gap:16px; align-items:center; }
.hud-item { display:flex; align-items:center; gap:4px; }
.hud-icon { font-size:16px; }
.hp-bar, .exp-bar {
  width: 120px; height: 14px;
  background: #333;
  border: 2px solid #555;
  position: relative;
  overflow: hidden;
}
.hp-bar .fill {
  height: 100%;
  background: linear-gradient(180deg, #e74c3c, #c0392b);
  transition: width 0.3s;
}
.exp-bar .fill {
  height: 100%;
  background: linear-gradient(180deg, #f5c518, #d4a017);
  transition: width 0.3s;
}
.bar-text {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
}

/* Map Screen */
#map-screen {
  flex-direction: column;
}
.map-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.map-title {
  font-size: 20px;
  color: var(--gold);
  margin-bottom: 20px;
  text-shadow: 2px 2px 0 #333;
}
.map-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
}
.map-row {
  display: flex;
  gap: 24px;
  justify-content: center;
}
.map-node {
  width: 72px; height: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 3px solid #444;
  background: #222;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  font-size: 28px;
}
.map-node:hover { border-color: var(--gold); transform: scale(1.1); }
.map-node.locked { opacity:0.3; cursor:not-allowed; }
.map-node.locked:hover { transform:none; border-color:#444; }
.map-node.current { border-color: var(--gold); box-shadow: 0 0 12px rgba(245,197,24,0.4); animation: nodePulse 1.5s ease-in-out infinite; }
.map-node.visited { opacity:0.5; border-color:#555; }
.map-node-label { font-size:9px; color:var(--muted); margin-top:2px; }
@keyframes nodePulse {
  0%,100% { box-shadow: 0 0 12px rgba(245,197,24,0.4); }
  50% { box-shadow: 0 0 20px rgba(245,197,24,0.8); }
}
.map-legend {
  display: flex; gap: 16px; margin-top: 20px; font-size: 12px; color: var(--muted);
}
.map-legend span { display:flex; align-items:center; gap:4px; }

/* Battle Screen */
#battle-screen {
  flex-direction: column;
}
.battle-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  position: relative;
}
.battle-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.enemy-panel {
  display: flex;
  align-items: center;
  gap: 12px;
}
.enemy-sprite {
  width: 80px; height: 80px;
  background: #2a1a3e;
  border: 3px solid #6a3093;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  position: relative;
}
.enemy-hp-bar {
  width: 150px; height: 16px;
  background: #333;
  border: 2px solid #555;
  position: relative;
}
.enemy-hp-bar .fill {
  height: 100%;
  background: linear-gradient(180deg, #9b59b6, #8e44ad);
  transition: width 0.3s;
}
.enemy-name {
  font-size: 16px;
  color: #c39bd3;
  margin-bottom: 4px;
}
.timer-bar {
  width: 100%;
  height: 20px;
  background: #333;
  border: 2px solid #555;
  margin-bottom: 12px;
  position: relative;
}
.timer-bar .fill {
  height: 100%;
  background: linear-gradient(180deg, #2ecc71, #27ae60);
  transition: width 0.1s linear;
}
.timer-bar.warning .fill { background: linear-gradient(180deg, #e67e22, #d35400); }
.timer-bar.danger .fill { background: linear-gradient(180deg, #e74c3c, #c0392b); }
.timer-text {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; text-shadow: 1px 1px 0 #000;
}

.match-area {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 40px;
  padding: 10px 0;
  position: relative;
}
.match-column {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 180px;
}
.match-card {
  padding: 12px 16px;
  background: #1e2a4a;
  border: 3px solid #3a506b;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 16px;
  text-align: center;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.match-card:hover { border-color: var(--blue); background: #253556; }
.match-card.selected { border-color: var(--gold); background: #2a3a5c; box-shadow: 0 0 10px rgba(245,197,24,0.3); }
.match-card.correct { border-color: var(--green); background: #1a3a2a; }
.match-card.wrong { border-color: var(--accent); background: #3a1a1a; }
.match-card.matched { opacity:0.3; pointer-events:none; }

.battle-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 12px;
}

/* Rest Screen */
#rest-screen {
  flex-direction: column;
}
.rest-area {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}
.rest-title {
  font-size: 24px;
  color: var(--green);
  text-align: center;
  margin-bottom: 20px;
}
.rest-options {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.rest-option {
  background: #1e2a4a;
  border: 3px solid #3a506b;
  padding: 16px 24px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  min-width: 140px;
}
.rest-option:hover { border-color: var(--green); transform: translateY(-2px); }
.rest-option .icon { font-size: 28px; margin-bottom: 8px; }
.rest-option .label { font-size: 14px; }

.deck-view {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 16px;
  max-height: 300px;
  overflow-y: auto;
}
.deck-view.show { display:flex; }
.deck-card {
  padding: 8px 12px;
  background: #1e2a4a;
  border: 2px solid #3a506b;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.deck-card:hover { border-color: var(--gold); }
.deck-card.selected { border-color: var(--accent); background: #3a1a2a; }
.master-confirm {
  display: none;
  text-align: center;
  margin-top: 12px;
}
.master-confirm.show { display:block; }

/* Event Screen */
#event-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.event-panel {
  background: #1e2a4a;
  border: 3px solid #6a3093;
  padding: 32px;
  max-width: 500px;
  text-align: center;
}
.event-icon { font-size: 48px; margin-bottom: 16px; }
.event-title { font-size: 20px; color: #c39bd3; margin-bottom: 12px; }
.event-desc { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
.event-choices { display: flex; flex-direction: column; gap: 8px; }
.event-choice {
  padding: 10px 16px;
  background: #16213e;
  border: 2px solid #3a506b;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 14px;
  text-align: left;
}
.event-choice:hover { border-color: var(--gold); }

/* Reward Screen */
#reward-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.reward-panel {
  background: #1e2a4a;
  border: 3px solid var(--gold);
  padding: 32px;
  max-width: 560px;
  text-align: center;
}
.reward-title { font-size: 20px; color: var(--gold); margin-bottom: 16px; }
.reward-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}
.reward-card {
  padding: 12px 16px;
  background: #16213e;
  border: 3px solid #3a506b;
  cursor: pointer;
  transition: all 0.15s;
  min-width: 120px;
}
.reward-card:hover { border-color: var(--green); }
.reward-card.selected { border-color: var(--green); background: #1a3a2a; }
.reward-card .word { font-size: 16px; color: var(--text); }
.reward-card .meaning { font-size: 11px; color: var(--muted); margin-top: 4px; }
.reward-info { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

/* Quiz overlay */
.quiz-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.quiz-overlay.show { display:flex; }
.quiz-panel {
  background: #1e2a4a;
  border: 3px solid var(--accent);
  padding: 32px;
  max-width: 480px;
  text-align: center;
}
.quiz-title { font-size: 18px; color: var(--accent); margin-bottom: 16px; }
.quiz-word { font-size: 32px; color: var(--gold); margin-bottom: 8px; }
.quiz-hint { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
.quiz-input {
  background: #16213e;
  border: 2px solid #3a506b;
  color: var(--text);
  padding: 10px 16px;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  width: 100%;
  text-align: center;
  margin-bottom: 16px;
  outline: none;
}
.quiz-input:focus { border-color: var(--gold); }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-opt {
  padding: 10px;
  background: #16213e;
  border: 2px solid #3a506b;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.quiz-opt:hover { border-color: var(--gold); }
.quiz-opt.correct { border-color: var(--green); background: #1a3a2a; }
.quiz-opt.wrong { border-color: var(--accent); background: #3a1a1a; }
.quiz-result { font-size: 16px; margin-top: 12px; }

/* Game Over / Victory */
#gameover-screen, #victory-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.go-panel {
  background: #1e2a4a;
  border: 3px solid var(--accent);
  padding: 40px;
  text-align: center;
}
.vic-panel {
  background: #1e2a4a;
  border: 3px solid var(--gold);
  padding: 40px;
  text-align: center;
}
.go-title { font-size: 36px; color: var(--accent); margin-bottom: 12px; }
.vic-title { font-size: 36px; color: var(--gold); margin-bottom: 12px; }
.go-stats, .vic-stats { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 2; }

/* Floating damage */
.float-dmg {
  position: absolute;
  font-size: 24px;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp 1s ease-out forwards;
  z-index: 50;
  text-shadow: 2px 2px 0 #000;
}
.float-dmg.damage { color: var(--accent); }
.float-dmg.heal { color: var(--green); }
.float-dmg.perfect { color: var(--gold); font-size: 30px; }
@keyframes floatUp {
  0% { opacity:1; transform: translateY(0); }
  100% { opacity:0; transform: translateY(-60px); }
}

/* Log */
.battle-log {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 6px 16px;
  font-size: 13px;
  color: var(--gold);
  border: 2px solid #444;
  white-space: nowrap;
  z-index: 20;
  transition: opacity 0.3s;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #444; }

/* ===== Responsive: Phone (≤600px) ===== */
@media (max-width: 600px) {
  /* HUD */
  .hud {
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .hud-left, .hud-right { gap: 8px; }
  .hp-bar, .exp-bar { width: 80px; height: 12px; }
  .bar-text { font-size: 9px; }

  /* Title */
  #title-screen { padding: 20px 16px; }
  #title-screen [style*="font-size:80px"] { font-size: 56px !important; }
  .title-logo { font-size: 26px !important; letter-spacing: 2px; }
  .title-sub { font-size: 14px; margin-bottom: 24px; }
  .pixel-btn { padding: 10px 24px; font-size: 15px; }

  /* Map */
  .map-container { padding: 12px 8px; }
  .map-title { font-size: 16px; margin-bottom: 12px; }
  .map-grid { gap: 12px; }
  .map-row { gap: 10px; }
  .map-node { width: 50px; height: 50px; font-size: 20px; }
  .map-node-label { font-size: 8px; }
  .map-legend { font-size: 10px; gap: 10px; margin-top: 12px; }

  /* Battle */
  .battle-area { padding: 10px 8px; }
  .battle-header { flex-direction: column; gap: 8px; align-items: flex-start; }
  .battle-header > div:last-child { text-align: left; }
  .enemy-sprite { width: 56px; height: 56px; font-size: 28px; }
  .enemy-name { font-size: 13px; }
  .enemy-hp-bar { width: 110px; height: 14px; }
  .timer-bar { height: 16px; margin-bottom: 8px; }
  .timer-text { font-size: 10px; }

  .match-area {
    gap: 10px;
    padding: 6px 0;
  }
  .match-column { min-width: 0; flex: 1; gap: 6px; }
  .match-card {
    font-size: 12px;
    padding: 8px 6px;
    min-height: 38px;
    border-width: 2px;
  }
  .match-area > div:nth-child(2) { gap: 4px; }
  .match-area > div:nth-child(2) > div:first-child { display: none; } /* hide ⟷ on mobile */
  .match-area > div:nth-child(2) > div:last-child { font-size: 10px; }

  .battle-actions { padding: 8px; }
  .battle-actions .pixel-btn { font-size: 14px; padding: 8px 20px; }
  .battle-log { font-size: 11px; bottom: 48px; padding: 4px 10px; }

  /* Rest */
  .rest-area { padding: 12px 8px; }
  .rest-title { font-size: 18px; margin-bottom: 12px; }
  .rest-options { gap: 8px; }
  .rest-option {
    min-width: 0;
    flex: 1 1 calc(50% - 8px);
    padding: 12px 8px;
  }
  .rest-option .icon { font-size: 22px; margin-bottom: 4px; }
  .rest-option .label { font-size: 12px; }
  .deck-card { font-size: 11px; padding: 6px 8px; }

  /* Event */
  .event-panel { padding: 20px 16px; max-width: 100%; }
  .event-icon { font-size: 36px; }
  .event-title { font-size: 16px; }
  .event-desc { font-size: 13px; }
  .event-choice { font-size: 13px; padding: 8px 12px; }

  /* Reward */
  .reward-panel { padding: 20px 14px; max-width: 100%; }
  .reward-title { font-size: 17px; }
  .reward-card { min-width: 100px; padding: 10px 10px; }
  .reward-card .word { font-size: 14px; }
  .reward-card .meaning { font-size: 10px; }

  /* Quiz */
  .quiz-panel { padding: 20px 14px; max-width: 100%; }
  .quiz-title { font-size: 15px; }
  .quiz-word { font-size: 24px; }
  .quiz-input { font-size: 16px; padding: 8px 12px; }
  .quiz-options { grid-template-columns: 1fr; gap: 6px; }
  .quiz-opt { font-size: 12px; padding: 8px; }

  /* Game Over / Victory */
  .go-panel, .vic-panel { padding: 24px 16px; }
  .go-title, .vic-title { font-size: 26px; }
  .go-stats, .vic-stats { font-size: 13px; }

  /* Deck Browse */
  .deck-browse { padding: 20px 12px; }
  .deck-browse h2 { font-size: 18px; }
  .deck-browse-card { min-width: 80px; padding: 8px 10px; }
  .deck-browse-card .en { font-size: 12px; }
  .deck-browse-card .cn { font-size: 10px; }

  /* Mastered panel */
  .mastered-word { font-size: 10px; padding: 2px 6px; }

  /* Float damage */
  .float-dmg { font-size: 18px; }
  .float-dmg.perfect { font-size: 22px; }
}

/* ===== Responsive: Small phone (≤380px) ===== */
@media (max-width: 380px) {
  .map-node { width: 42px; height: 42px; font-size: 17px; }
  .map-row { gap: 6px; }
  .map-grid { gap: 8px; }
  .match-card { font-size: 11px; padding: 6px 4px; min-height: 34px; }
  .enemy-sprite { width: 48px; height: 48px; font-size: 24px; }
  .rest-option { flex: 1 1 100%; }
  .pixel-btn { padding: 8px 18px; font-size: 13px; }
}

/* Transition effect */
.screen-transition {
  animation: screenFade 0.4s ease;
}
@keyframes screenFade {
  0% { opacity:0; transform: scale(0.95); }
  100% { opacity:1; transform: scale(1); }
}

/* Mastered words panel */
.mastered-panel {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: #16213e;
  border: 2px solid #2d6a4f;
  max-height: 200px;
  overflow-y: auto;
}
.mastered-panel.show { display:block; }
.mastered-panel h3 { color: var(--green); font-size: 14px; margin-bottom: 8px; }
.mastered-word { display:inline-block; padding: 2px 8px; margin: 2px; background:#1a3a2a; border:1px solid #2d6a4f; font-size:11px; color:var(--green); }

/* Boss special */
.enemy-sprite.boss { 
  border-color: #e74c3c; 
  box-shadow: 0 0 20px rgba(231,76,60,0.4);
  animation: bossGlow 1.5s ease-in-out infinite;
}
@keyframes bossGlow {
  0%,100% { box-shadow: 0 0 20px rgba(231,76,60,0.4); }
  50% { box-shadow: 0 0 30px rgba(231,76,60,0.8); }
}

/* Deck browse */
.deck-browse {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  overflow-y: auto;
}
.deck-browse.show { display:flex; }
.deck-browse h2 { color: var(--gold); margin-bottom: 16px; }
.deck-browse-grid {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px;
}
.deck-browse-card {
  padding: 10px 14px;
  background: #1e2a4a;
  border: 2px solid #3a506b;
  min-width: 100px;
  text-align: center;
}
.deck-browse-card .en { font-size: 14px; color: var(--text); }
.deck-browse-card .cn { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>

<!-- Title Screen -->
<div id="title-screen" class="screen active">
  <div style="text-align:center">
    <div style="font-size:80px;margin-bottom:8px">🏰</div>
    <div class="title-logo">词塔征服</div>
    <div class="title-sub">WORD TOWER CONQUEST</div>
    <div style="margin-bottom:32px;font-size:13px;color:var(--muted);line-height:1.8">
      爬塔战斗 · 记忆单词 · 永久掌握<br>
      <span style="color:var(--gold)">⚔️ 连线战斗</span> · <span style="color:var(--green)">📖 学习成长</span> · <span style="color:var(--accent)">💀 Boss挑战</span>
    </div>
    <button class="pixel-btn" onclick="startGame()">开始征服</button>
    <div style="margin-top:16px;font-size:11px;color:#555">WASD/方向键 移动 · 鼠标点击选择</div>
  </div>
</div>

<!-- Map Screen -->
<div id="map-screen" class="screen">
  <div class="hud" id="map-hud"></div>
  <div class="map-container">
    <div class="map-title" id="map-title">第一层 · 基础词汇</div>
    <div class="map-grid" id="map-grid"></div>
    <div class="map-legend">
      <span>⚔️ 战斗</span>
      <span>🔥 休息</span>
      <span>❓ 事件</span>
      <span>💀 Boss</span>
    </div>
  </div>
</div>

<!-- Battle Screen -->
<div id="battle-screen" class="screen">
  <div class="hud" id="battle-hud"></div>
  <div class="battle-area" id="battle-area">
    <div class="battle-header">
      <div class="enemy-panel">
        <div class="enemy-sprite" id="enemy-sprite">👹</div>
        <div>
          <div class="enemy-name" id="enemy-name">单词守卫</div>
          <div class="enemy-hp-bar"><div class="fill" id="enemy-hp-fill" style="width:100%"></div><div class="bar-text" id="enemy-hp-text">100/100</div></div>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:13px;color:var(--muted)" id="battle-round">回合 1</div>
        <div style="font-size:11px;color:#555" id="deck-count">牌库: 20</div>
      </div>
    </div>
    <div class="timer-bar" id="timer-bar"><div class="fill" id="timer-fill" style="width:100%"></div><div class="timer-text" id="timer-text">15s</div></div>
    <div class="match-area" id="match-area">
      <div class="match-column" id="eng-col"></div>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div style="font-size:24px">⟷</div>
        <div style="font-size:11px;color:var(--muted)" id="match-count">已连线: 0/5</div>
      </div>
      <div class="match-column" id="chn-col"></div>
    </div>
    <div class="battle-log" id="battle-log"></div>
    <div class="battle-actions">
      <button class="pixel-btn green" id="btn-confirm" onclick="confirmMatch()" disabled>确认连线</button>
    </div>
  </div>
</div>

<!-- Rest Screen -->
<div id="rest-screen" class="screen">
  <div class="hud" id="rest-hud"></div>
  <div class="rest-area">
    <div class="rest-title">🔥 休息营地</div>
    <div class="rest-options">
      <div class="rest-option" onclick="restHeal()">
        <div class="icon">❤️</div>
        <div class="label">回复 30% 生命</div>
      </div>
      <div class="rest-option" onclick="toggleDeckView()">
        <div class="icon">📖</div>
        <div class="label">翻阅牌库</div>
      </div>
      <div class="rest-option" onclick="toggleMasterView()">
        <div class="icon">🧠</div>
        <div class="label">掌握单词</div>
      </div>
      <div class="rest-option" onclick="leaveRest()">
        <div class="icon">➡️</div>
        <div class="label">继续前进</div>
      </div>
    </div>
    <div class="deck-view" id="deck-view"></div>
    <div class="deck-view" id="master-view"></div>
    <div class="master-confirm" id="master-confirm">
      <button class="pixel-btn green" onclick="confirmMaster()">确认掌握 (<span id="master-count">0</span> 词)</button>
    </div>
    <div class="mastered-panel" id="mastered-panel">
      <h3>✅ 已掌握词库</h3>
      <div id="mastered-list"></div>
    </div>
  </div>
</div>

<!-- Event Screen -->
<div id="event-screen" class="screen">
  <div class="hud" id="event-hud"></div>
  <div class="event-panel" id="event-panel"></div>
</div>

<!-- Reward Screen -->
<div id="reward-screen" class="screen">
  <div class="reward-panel" id="reward-panel"></div>
</div>

<!-- Quiz Overlay -->
<div class="quiz-overlay" id="quiz-overlay">
  <div class="quiz-panel" id="quiz-panel"></div>
</div>

<!-- Deck Browse -->
<div class="deck-browse" id="deck-browse">
  <h2>📖 当前牌库</h2>
  <div class="deck-browse-grid" id="deck-browse-grid"></div>
  <button class="pixel-btn" onclick="closeDeckBrowse()" style="margin-top:16px;font-size:13px;padding:8px 20px">关闭</button>
</div>

<!-- Game Over -->
<div id="gameover-screen" class="screen">
  <div class="go-panel">
    <div class="go-title">💀 征服失败</div>
    <div class="go-stats" id="go-stats"></div>
    <button class="pixel-btn" onclick="startGame()">再次挑战</button>
  </div>
</div>

<!-- Victory -->
<div id="victory-screen" class="screen">
  <div class="vic-panel">
    <div class="vic-title">🏆 征服成功!</div>
    <div class="vic-stats" id="vic-stats"></div>
    <button class="pixel-btn gold" onclick="startGame()">新的征程</button>

</div>

    desc:'一个戴着面具的商人从阴影中走出。「我有好东西，用你的记忆来换……」他提供3张高级单词卡，但你必须接受一次额外考核。',
    type:"merchant",
  },
];


// ==========================================
// GAME STATE
// ==========================================
let G = {};

function initState() {
  G = {
    hp: 100, maxHp: 100,
    atk: 15,
    floor: 1,
    currentRow: 0,
    currentCol: -1,
    deck: [],           // current word deck
    mastered: [],       // permanently mastered words
    pendingMaster: [],  // words awaiting quiz
    tempBuffs: [],      // temporary buffs from mastering
    permBuffs: [],      // permanent buffs from passed quizzes
    map: [],
    visited: [],
    round: 0,
    score: 0,
    wordsEncountered: 0,
    perfectMatches: 0,
    totalMatches: 0,
    restUsed: false,
    bonusTime: 0,
    extraErrorForgive: 0,
    floorWordLevel: 1,
  };
  // Generate initial deck
  generateDeck(20);
  generateMap();
}

function generateDeck(count) {
  const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
  const used = new Set(G.deck.map(w=>w.en).concat(G.mastered.map(w=>w.en)));
  const available = pool.filter(w => !used.has(w.en));
  const shuffled = shuffle([...available]);
  for (let i = 0; i < Math.min(count, shuffled.length); i++) {
    G.deck.push(shuffled[i]);
  }
}

function generateMap() {
  const cols = 5 + Math.floor(Math.random() * 3); // 5-7 columns
  G.map = [];
  for (let r = 0; r < 3; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      let type;
      if (c === cols - 1) {
        type = 'boss';
      } else if (c === 0) {
        type = 'battle';
      } else {
        const rand = Math.random();
        if (rand < 0.45) type = 'battle';
        else if (rand < 0.65) type = 'rest';
        else if (rand < 0.85) type = 'event';
        else type = 'battle';
      }
      row.push({ type, visited: false });
    }
    G.map.push(row);
  }
  G.currentRow = 1; // start middle
  G.currentCol = -1;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ==========================================
// SCREEN MANAGEMENT
// ==========================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active', 'screen-transition');
  setTimeout(() => el.classList.remove('screen-transition'), 400);
}

// ==========================================
// HUD
// ==========================================
function renderHud(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = `
    <div class="hud-left">
      <div class="hud-item"><span class="hud-icon">❤️</span>
        <div class="hp-bar"><div class="fill" style="width:${(G.hp/G.maxHp*100)}%"></div><div class="bar-text">${G.hp}/${G.maxHp}</div></div>
      </div>
      <div class="hud-item"><span class="hud-icon">⚔️</span> ${G.atk}</div>
      <div class="hud-item"><span class="hud-icon">🏰</span> 第${G.floor}层</div>
    </div>
    <div class="hud-right">
      <div class="hud-item"><span class="hud-icon">📚</span> 牌库:${G.deck.length}</div>
      <div class="hud-item"><span class="hud-icon">✅</span> 掌握:${G.mastered.length}</div>
      <div class="hud-item"><span class="hud-icon">⭐</span> ${G.score}</div>
    </div>
  `;
}

// ==========================================
// START GAME
// ==========================================
function startGame() {
  initState();
  showMapScreen();
}

function showMapScreen() {
  renderHud('map-hud');
  document.getElementById('map-title').textContent = `第${G.floor}层 · ${['基础词汇','进阶词汇','高级词汇'][G.floor-1]||'终极词汇'}`;
  renderMap();
  showScreen('map-screen');
}

function renderMap() {
  const grid = document.getElementById('map-grid');
  grid.innerHTML = '';
  const icons = { battle:'⚔️', rest:'🔥', event:'❓', boss:'💀' };
  const labels = { battle:'战斗', rest:'休息', event:'事件', boss:'Boss' };

  for (let r = 0; r < 3; r++) {
    const row = document.createElement('div');
    row.className = 'map-row';
    for (let c = 0; c < G.map[r].length; c++) {
      const node = G.map[r][c];
      const el = document.createElement('div');
      el.className = 'map-node';
      
      const isCurrent = (r === G.currentRow && c === G.currentCol);
      const isNext = (c === G.currentCol + 1 && Math.abs(r - G.currentRow) <= 1);
      const isVisited = node.visited;
      
      if (isCurrent) el.classList.add('current');
      else if (isVisited) el.classList.add('visited');
      else if (!isNext) el.classList.add('locked');
      
      el.innerHTML = `<span>${icons[node.type]}</span><div class="map-node-label">${labels[node.type]}</div>`;
      
      if (isNext) {
        el.onclick = () => enterNode(r, c);
      }
      row.appendChild(el);
    }
    grid.appendChild(row);
  }
}

function enterNode(row, col) {
  G.currentRow = row;
  G.currentCol = col;
  G.map[row][col].visited = true;
  G.restUsed = false;
  G.round = 0;
  
  const node = G.map[row][col];
  switch(node.type) {
    case 'battle': startBattle(false); break;
    case 'rest': showRestScreen(); break;
    case 'event': showEventScreen(); break;
    case 'boss': startBattle(true); break;
  }
}

// ==========================================
// BATTLE SYSTEM
// ==========================================
let battleState = {};

function startBattle(isBoss) {
  const enemies = isBoss ? BOSSES : ENEMIES;
  const enemy = isBoss ? 
    BOSSES[Math.min(G.floor - 1, BOSSES.length - 1)] :
    ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
  
  // Scale enemy
  const scaleFactor = 1 + (G.floor - 1) * 0.3;
  
  battleState = {
    enemy: {
      ...enemy,
      hp: Math.floor(enemy.hp * scaleFactor),
      maxHp: Math.floor(enemy.hp * scaleFactor),
      atk: Math.floor(enemy.atk * scaleFactor),
      pairs: isBoss ? 8 : 5,
    },
    isBoss,
    round: ++G.round,
    timeLeft: 15 + G.bonusTime,
    timer: null,
    selectedEng: null,
    selectedChn: null,
    matches: [],
    matchCount: 0,
    correctCount: 0,
    wrongCount: 0,
    battleCards: [],
    answered: false,
  };
  
  // Pick words for this battle
  const deck = [...G.deck];
  if (deck.length === 0) {
    // No words left, auto win
    endBattle(true);
    return;
  }
  const count = Math.min(battleState.enemy.pairs, deck.length);
  const picked = shuffle(deck).slice(0, count);
  battleState.battleCards = picked;
  battleState.enemy.pairs = count;
  
  renderBattleScreen();
  showScreen('battle-screen');
  startTimer();
}

function renderBattleScreen() {
  renderHud('battle-hud');
  const e = battleState.enemy;
  
  document.getElementById('enemy-sprite').textContent = e.emoji;
  document.getElementById('enemy-sprite').className = battleState.isBoss ? 'enemy-sprite boss' : 'enemy-sprite';
  document.getElementById('enemy-name').textContent = e.name + (battleState.isBoss ? ' 👑' : '');
  document.getElementById('enemy-hp-fill').style.width = (e.hp / e.maxHp * 100) + '%';
  document.getElementById('enemy-hp-text').textContent = `${e.hp}/${e.maxHp}`;
  document.getElementById('battle-round').textContent = `回合 ${battleState.round}`;
  document.getElementById('deck-count').textContent = `牌库: ${G.deck.length}`;
  
  renderMatchCards();
  updateMatchCount();
}

function renderMatchCards() {
  const engCol = document.getElementById('eng-col');
  const chnCol = document.getElementById('chn-col');
  engCol.innerHTML = '';
  chnCol.innerHTML = '';
  
  const words = battleState.battleCards;
  const engOrder = shuffle([...words]);
  const chnOrder = shuffle([...words]);
  
  engOrder.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.textContent = w.en;
    card.dataset.word = w.en;
    card.dataset.side = 'eng';
    card.onclick = () => selectCard(card, 'eng', w.en);
    engCol.appendChild(card);
  });
  
  chnOrder.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.textContent = w.cn;
    card.dataset.word = w.en;
    card.dataset.side = 'chn';
    card.onclick = () => selectCard(card, 'chn', w.en);
    chnCol.appendChild(card);
  });
}

function selectCard(card, side, word) {
  if (card.classList.contains('matched')) return;
  
  // Deselect same side
  document.querySelectorAll(`.match-card[data-side="${side}"]`).forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  
  if (side === 'eng') battleState.selectedEng = word;
  else battleState.selectedChn = word;
  
  // Check if both selected
  if (battleState.selectedEng && battleState.selectedChn) {
    checkMatch();
  }
}

function checkMatch() {
  const eng = battleState.selectedEng;
  const chn = battleState.selectedChn;
  
  const engCards = document.querySelectorAll('.match-card[data-side="eng"]');
  const chnCards = document.querySelectorAll('.match-card[data-side="chn"]');
  
  const engCard = [...engCards].find(c => c.dataset.word === eng && c.classList.contains('selected'));
  const chnCard = [...chnCards].find(c => c.dataset.word === chn && c.classList.contains('selected'));
  
  if (eng === chn) {
    // Correct match
    engCard.classList.remove('selected');
    chnCard.classList.remove('selected');
    engCard.classList.add('correct');
    chnCard.classList.add('correct');
    setTimeout(() => {
      engCard.classList.add('matched');
      chnCard.classList.add('matched');
    }, 300);
    battleState.matchCount++;
    battleState.correctCount++;
    battleState.matches.push(eng);
    
    // Damage
    let dmg = G.atk;
    // Apply buffs
    G.permBuffs.concat(G.tempBuffs).forEach(b => {
      if (b.type === 'atk') dmg += b.value;
    });
    
    const isPerfect = battleState.matchCount === battleState.battleCards.length && battleState.wrongCount === 0;
    if (isPerfect) {
      dmg *= 2;
      showFloatDmg('💥 完美连线! ×2', 'perfect');
      G.perfectMatches++;
    }
    
    battleState.enemy.hp = Math.max(0, battleState.enemy.hp - dmg);
    showFloatDmg(`-${dmg}`, 'damage');
    G.totalMatches++;
    G.wordsEncountered++;
    
    showLog(`✅ ${eng} 正确! 造成 ${dmg} 伤害`);
  } else {
    // Wrong match
    engCard.classList.remove('selected');
    chnCard.classList.remove('selected');
    engCard.classList.add('wrong');
    chnCard.classList.add('wrong');
    setTimeout(() => {
      engCard.classList.remove('wrong');
      chnCard.classList.remove('wrong');
    }, 500);
    battleState.wrongCount++;
    
    showLog(`❌ ${eng} ≠ ${chn}`);
  }
  
  battleState.selectedEng = null;
  battleState.selectedChn = null;
  updateMatchCount();
  updateEnemyHp();
  updateMatchCountDisplay();
  
  // Check if all matched
  if (battleState.matchCount >= battleState.battleCards.length) {
    setTimeout(() => endBattleRound(), 600);
  }
}

function updateEnemyHp() {
  const e = battleState.enemy;
  document.getElementById('enemy-hp-fill').style.width = (e.hp / e.maxHp * 100) + '%';
  document.getElementById('enemy-hp-text').textContent = `${e.hp}/${e.maxHp}`;
}

function updateMatchCount() {
  document.getElementById('btn-confirm').disabled = battleState.matchCount === 0;
}

function updateMatchCountDisplay() {
  document.getElementById('match-count').textContent = `已连线: ${battleState.matchCount}/${battleState.battleCards.length}`;
}

function startTimer() {
  const totalTime = 15 + G.bonusTime;
  battleState.timeLeft = totalTime;
  updateTimerDisplay();
  
  battleState.timer = setInterval(() => {
    battleState.timeLeft -= 0.1;
    if (battleState.timeLeft <= 0) {
      battleState.timeLeft = 0;
      clearInterval(battleState.timer);
      endBattleRound();
    }
    updateTimerDisplay();
  }, 100);
}

function updateTimerDisplay() {
  const pct = battleState.timeLeft / (15 + G.bonusTime) * 100;
  document.getElementById('timer-fill').style.width = pct + '%';
  document.getElementById('timer-text').textContent = Math.ceil(battleState.timeLeft) + 's';
  
  const bar = document.getElementById('timer-bar');
  bar.className = 'timer-bar';
  if (pct < 25) bar.classList.add('danger');
  else if (pct < 50) bar.classList.add('warning');
}

function endBattleRound() {
  clearInterval(battleState.timer);
  battleState.answered = true;
  
  const e = battleState.enemy;
  if (e.hp <= 0) {
    endBattle(true);
    return;
  }
  
  // Enemy attacks
  let enemyDmg = e.atk;
  // Extra damage for wrong matches
  enemyDmg += battleState.wrongCount * 3;
  // Forgive errors if buff active
  if (G.extraErrorForgive > 0) {
    enemyDmg = Math.max(0, enemyDmg - battleState.wrongCount * 3);
    G.extraErrorForgive--;
  }
  
  G.hp = Math.max(0, G.hp - enemyDmg);
  showFloatDmg(`-${enemyDmg}`, 'damage');
  showLog(`${e.name} 发动攻击! 造成 ${enemyDmg} 伤害`);
  
  renderHud('battle-hud');
  
  if (G.hp <= 0) {
    setTimeout(() => gameOver(), 800);
    return;
  }
  
  // Next round
  setTimeout(() => {
    if (e.hp > 0) {
      startBattleRound();
    }
  }, 1200);
}

function startBattleRound() {
  battleState.round++;
  battleState.selectedEng = null;
  battleState.selectedChn = null;
  battleState.matchCount = 0;
  battleState.correctCount = 0;
  battleState.wrongCount = 0;
  battleState.matches = [];
  battleState.answered = false;
  
  // Pick new cards
  const available = G.deck.filter(w => !battleState.battleCards.some(b => b.en === w.en));
  if (available.length < battleState.enemy.pairs) {
    // Not enough unique words, reuse
    battleState.battleCards = shuffle([...G.deck]).slice(0, battleState.enemy.pairs);
  } else {
    battleState.battleCards = shuffle([...available]).slice(0, battleState.enemy.pairs);
  }
  
  renderBattleScreen();
  startTimer();
}

function confirmMatch() {
  if (battleState.answered) return;
  clearInterval(battleState.timer);
  endBattleRound();
}

function endBattle(won) {
  clearInterval(battleState.timer);
  if (won) {
    G.score += battleState.isBoss ? 100 : 30;
    showLog('🎉 战斗胜利!');
    
    if (battleState.isBoss) {
      // Advance floor
      if (G.floor >= 3) {
        showVictory();
        return;
      }
      G.floor++;
      G.floorWordLevel = Math.min(G.floor, 3);
      generateDeck(5);
      generateMap();
      setTimeout(() => showMapScreen(), 800);
    } else {
      // Show reward
      setTimeout(() => showRewardScreen(), 800);
    }
  } else {
    showLog('💀 战斗失败...');
    setTimeout(() => showMapScreen(), 800);
  }
}

function showFloatDmg(text, type) {
  const area = document.getElementById('battle-area');
  const el = document.createElement('div');
  el.className = `float-dmg ${type}`;
  el.textContent = text;
  el.style.left = (30 + Math.random() * 40) + '%';
  el.style.top = (20 + Math.random() * 20) + '%';
  area.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function showLog(text) {
  const log = document.getElementById('battle-log');
  log.textContent = text;
  log.style.opacity = 1;
  clearTimeout(log._timeout);
  log._timeout = setTimeout(() => { log.style.opacity = 0; }, 2000);
}

// ==========================================
// REWARD SCREEN
// ==========================================
function showRewardScreen() {
  const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
  const used = new Set(G.deck.map(w=>w.en).concat(G.mastered.map(w=>w.en)));
  const available = pool.filter(w => !used.has(w.en));
  const picks = shuffle([...available]).slice(0, 5);
  
  const panel = document.getElementById('reward-panel');
  panel.innerHTML = `
    <div class="reward-title">🎁 战利品</div>
    <div class="reward-info">选择 0~2 张单词卡加入牌库（当前牌库: ${G.deck.length} 张）</div>
    <div class="reward-cards" id="reward-cards"></div>
    <div style="margin-top:8px;font-size:12px;color:var(--muted)" id="reward-sel-info">已选: 0/2</div>
    <div style="margin-top:16px">
      <button class="pixel-btn green" onclick="confirmReward()">确认选择</button>
    </div>
  `;
  
  const container = document.getElementById('reward-cards');
  picks.forEach(w => {
    const card = document.createElement('div');
    card.className = 'reward-card';
    card.innerHTML = `<div class="word">${w.en}</div><div class="meaning">${w.cn}</div>`;
    card.onclick = () => toggleRewardCard(card, w);
    container.appendChild(card);
  });
  
  window._rewardPicks = [];
  window._rewardWords = picks;
  showScreen('reward-screen');
}

function toggleRewardCard(card, word) {
  const idx = window._rewardPicks.findIndex(w => w.en === word.en);
  if (idx >= 0) {
    window._rewardPicks.splice(idx, 1);
    card.classList.remove('selected');
  } else if (window._rewardPicks.length < 2) {
    window._rewardPicks.push(word);
    card.classList.add('selected');
  }
  document.getElementById('reward-sel-info').textContent = `已选: ${window._rewardPicks.length}/2`;
}

function confirmReward() {
  window._rewardPicks.forEach(w => G.deck.push(w));
  showMapScreen();
}

// ==========================================
// REST SCREEN
// ==========================================
function showRestScreen() {
  renderHud('rest-hud');
  document.getElementById('deck-view').classList.remove('show');
  document.getElementById('master-view').classList.remove('show');
  document.getElementById('master-confirm').classList.remove('show');

  // Show mastered panel if any
  const mp = document.getElementById('mastered-panel');
  if (G.mastered.length > 0) {
    mp.classList.add('show');
    document.getElementById('mastered-list').innerHTML = 
      G.mastered.map(w => `<span class="mastered-word">${w.en} ${w.cn}</span>`).join('');
  } else {
    mp.classList.remove('show');
  }

  // Update heal button state
  renderHealButton();

  // Show pending quiz info
  renderPendingQuizInfo();

  showScreen('rest-screen');

  // If there are pending mastered words from previous rest, auto-trigger quiz
  if (G.pendingMaster.length > 0) {
    setTimeout(() => startQuiz(0), 500);
  }
}

function renderHealButton() {
  const opts = document.querySelectorAll('.rest-option');
  const healBtn = opts[0]; // first option is heal
  if (G.restUsed) {
    healBtn.style.opacity = '0.35';
    healBtn.style.cursor = 'not-allowed';
    healBtn.style.borderColor = '#222';
    healBtn.querySelector('.label').textContent = '已回复过';
  } else {
    healBtn.style.opacity = '1';
    healBtn.style.cursor = 'pointer';
    healBtn.style.borderColor = '#3a506b';
    healBtn.querySelector('.label').textContent = '回复 30% 生命';
  }
}

function renderPendingQuizInfo() {
  let infoEl = document.getElementById('pending-quiz-info');
  if (!infoEl) {
    infoEl = document.createElement('div');
    infoEl.id = 'pending-quiz-info';
    const restArea = document.querySelector('.rest-area');
    restArea.insertBefore(infoEl, restArea.children[2]);
  }
  if (G.pendingMaster.length > 0) {
    infoEl.style.cssText = 'text-align:center;padding:10px;margin:0 0 12px;background:#2a1a3e;border:2px solid #6a3093;font-size:13px;color:#c39bd3;';
    infoEl.innerHTML = `📝 有 <b>${G.pendingMaster.length}</b> 个待考核单词（上次休息时掌握）<br><span style="font-size:11px;color:#888">即将开始考核，请做好准备...</span>`;
  } else {
    infoEl.style.display = 'none';
  }
}

function restHeal() {
  if (G.restUsed) return;
  const heal = Math.floor(G.maxHp * 0.3);
  G.hp = Math.min(G.maxHp, G.hp + heal);
  G.restUsed = true;
  showLog(`❤️ 回复 ${heal} 点生命`);
  renderHud('rest-hud');
  renderHealButton();
}

function toggleDeckView() {
  const dv = document.getElementById('deck-view');
  const mv = document.getElementById('master-view');
  mv.classList.remove('show');
  document.getElementById('master-confirm').classList.remove('show');
  
  dv.classList.toggle('show');
  if (dv.classList.contains('show')) {
    dv.innerHTML = G.deck.map(w => 
      `<div class="deck-card"><b>${w.en}</b><br><span style="color:var(--muted);font-size:11px">${w.cn}</span></div>`
    ).join('');
  }
}

function toggleMasterView() {
  const mv = document.getElementById('master-view');
  const dv = document.getElementById('deck-view');
  dv.classList.remove('show');
  
  mv.classList.toggle('show');
  if (mv.classList.contains('show')) {
    window._masterSelected = [];
    mv.innerHTML = `
      <div style="width:100%;text-align:center;margin-bottom:8px;font-size:13px;color:var(--gold)">选择你已掌握的单词（将暂时移出牌库，待下次休息时考核）</div>
      ${G.deck.map((w,i) => 
        `<div class="deck-card" data-idx="${i}" onclick="toggleMasterWord(this,${i})"><b>${w.en}</b><br><span style="color:var(--muted);font-size:11px">${w.cn}</span></div>`
      ).join('')}
    `;
    document.getElementById('master-confirm').classList.add('show');
    document.getElementById('master-count').textContent = '0';
  } else {
    document.getElementById('master-confirm').classList.remove('show');
  }
}

function toggleMasterWord(card, idx) {
  const i = window._masterSelected.indexOf(idx);
  if (i >= 0) {
    window._masterSelected.splice(i, 1);
    card.classList.remove('selected');
  } else {
    window._masterSelected.push(idx);
    card.classList.add('selected');
  }
  document.getElementById('master-count').textContent = window._masterSelected.length;
}

function confirmMaster() {
  if (!window._masterSelected || window._masterSelected.length === 0) return;
  
  const words = window._masterSelected.sort((a,b) => b-a).map(i => G.deck[i]);
  
  // Remove from deck
  window._masterSelected.sort((a,b) => b-a).forEach(i => G.deck.splice(i, 1));
  
  // Add to pending
  G.pendingMaster.push(...words);
  
  // Add temp buffs
  words.forEach(w => {
    G.tempBuffs.push({type:'atk', value: 3, word: w.en});
  });
  
  G.atk += words.length * 3;
  
  window._masterSelected = [];
  toggleMasterView();
  showLog(`🧠 掌握了 ${words.length} 个单词，攻击力 +${words.length * 3}`);
  renderHud('rest-hud');
}

function leaveRest() {
  showMapScreen();
}

// ==========================================
// QUIZ SYSTEM
// ==========================================
function startQuiz(idx) {
  if (idx >= G.pendingMaster.length) {
    G.pendingMaster = [];
    window._quizType = undefined; // reset for next session
    // Hide the pending quiz info
    const infoEl = document.getElementById('pending-quiz-info');
    if (infoEl) infoEl.style.display = 'none';
    // Stay at rest screen so player can use remaining options
    showRestScreen();
    return;
  }

  // Lock quiz type for entire session (pick once on first call)
  if (window._quizType === undefined) {
    window._quizType = Math.random() < 0.5 ? 'spell' : 'choice';
  }

  const word = G.pendingMaster[idx];
  const overlay = document.getElementById('quiz-overlay');
  overlay.classList.add('show');
  const panel = document.getElementById('quiz-panel');

  if (window._quizType === 'spell') {
    // Give Chinese, type English
    panel.innerHTML = `
      <div class="quiz-title">📝 拼写考核 (${idx+1}/${G.pendingMaster.length})</div>
      <div class="quiz-hint">根据中文释义，拼写出英文单词，按回车确认</div>
      <div style="font-size:24px;color:var(--gold);margin:12px 0">${word.cn}</div>
      <input class="quiz-input" id="quiz-input" placeholder="输入英文单词..." autocomplete="off" autofocus>
      <div class="quiz-result" id="quiz-result"></div>
    `;
    setTimeout(() => {
      const inp = document.getElementById('quiz-input');
      if (inp) {
        inp.focus();
        inp.addEventListener('keydown', function handler(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            inp.removeEventListener('keydown', handler);
            checkSpellQuiz(idx);
          }
        });
      }
    }, 100);
  } else {
    // 4-choice
    const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
    const wrongs = shuffle(pool.filter(w => w.en !== word.en)).slice(0, 3);
    const options = shuffle([word, ...wrongs]);

    panel.innerHTML = `
      <div class="quiz-title">🎯 释义考核 (${idx+1}/${G.pendingMaster.length})</div>
      <div class="quiz-hint">选择 "<b>${word.en}</b>" 的正确释义</div>
      <div class="quiz-options" id="quiz-options">
        ${options.map(o => `<div class="quiz-opt" onclick="checkChoiceQuiz(${idx},'${o.en}','${word.en}',this)">${o.cn}</div>`).join('')}
      </div>
      <div class="quiz-result" id="quiz-result"></div>
    `;
  }
}

function checkSpellQuiz(idx) {
  const input = document.getElementById('quiz-input').value.trim().toLowerCase();
  const word = G.pendingMaster[idx];
  const result = document.getElementById('quiz-result');
  
  if (input === word.en.toLowerCase()) {
    result.innerHTML = '<span style="color:var(--green)">✅ 正确! 已永久掌握</span>';
    passQuiz(idx);
  } else {
    result.innerHTML = `<span style="color:var(--accent)">❌ 错误! 答案: ${word.en}</span>`;
    failQuiz(idx);
  }
  setTimeout(() => {
    document.getElementById('quiz-overlay').classList.remove('show');
    startQuiz(idx + 1);
  }, 1500);
}

function checkChoiceQuiz(idx, selected, correct, el) {
  const result = document.getElementById('quiz-result');
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  
  if (selected === correct) {
    el.classList.add('correct');
    result.innerHTML = '<span style="color:var(--green)">✅ 正确! 已永久掌握</span>';
    passQuiz(idx);
  } else {
    el.classList.add('wrong');
    opts.forEach(o => { if (o.textContent === getWordCn(correct)) o.classList.add('correct'); });
    result.innerHTML = `<span style="color:var(--accent)">❌ 错误!</span>`;
    failQuiz(idx);
  }
  
  function getWordCn(en) {
    const w = G.pendingMaster[idx];
    return w.cn;
  }
  
  setTimeout(() => {
    document.getElementById('quiz-overlay').classList.remove('show');
    startQuiz(idx + 1);
  }, 1500);
}

function passQuiz(idx) {
  const word = G.pendingMaster[idx];
  G.mastered.push(word);
  // Convert temp buff to perm
  const tempIdx = G.tempBuffs.findIndex(b => b.word === word.en);
  if (tempIdx >= 0) {
    G.permBuffs.push(G.tempBuffs[tempIdx]);
    G.tempBuffs.splice(tempIdx, 1);
  } else {
    // Remove temp atk buff that was already applied
    G.permBuffs.push({type:'atk', value: 3, word: word.en});
  }
  G.score += 20;
}

function failQuiz(idx) {
  const word = G.pendingMaster[idx];
  // Return to deck
  G.deck.push(word);
  // Remove temp buff
  const tempIdx = G.tempBuffs.findIndex(b => b.word === word.en);
  if (tempIdx >= 0) {
    G.atk -= G.tempBuffs[tempIdx].value;
    G.tempBuffs.splice(tempIdx, 1);
  }
  // Penalty
  G.hp = Math.max(1, G.hp - 10);
  showLog('💔 考核失败，-10 生命');
}

// ==========================================
// EVENT SCREEN
// ==========================================
function showEventScreen() {
  renderHud('event-hud');
  const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  const panel = document.getElementById('event-panel');
  
  let choicesHtml = '';
  
  switch(event.type) {
    case 'scholar': {
      // Fill-in-the-blank sentence quiz
      const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
      const word = pool[Math.floor(Math.random() * pool.length)];
      const wrongs = shuffle(pool.filter(w => w.en !== word.en)).slice(0, 3);
      const options = shuffle([word, ...wrongs]);
      const sentences = [
        `The teacher asked us to _____ the new vocabulary.`,
        `She tried to _____ the meaning of the text.`,
        `We need to _____ our understanding of the topic.`,
        `He showed great _____ in his studies.`,
      ];
      const sentence = sentences[Math.floor(Math.random() * sentences.length)];
      
      panel.innerHTML = `
        <div class="event-icon">${event.emoji}</div>
        <div class="event-title">${event.name}</div>
        <div class="event-desc">"${sentence}"<br><br>选择正确的单词填入空格</div>
        <div class="event-choices">
          ${options.map(o => 
            `<div class="event-choice" onclick="scholarAnswer('${o.en}','${word.en}',this,${o.en===word.en})">${o.en} — ${o.cn}</div>`
          ).join('')}
        </div>
      `;
      break;
    }
    case 'fountain': {
      const roots = ['-tion','-ment','-able','-ous','-ive','-ing','-ed','-ly','-er','-al'];
      const picked = shuffle(roots).slice(0, 3);
      panel.innerHTML = `
        <div class="event-icon">${event.emoji}</div>
        <div class="event-title">${event.name}</div>
        <div class="event-desc">${event.desc}</div>
        <div class="event-choices">
          ${picked.map(r => 
            `<div class="event-choice" onclick="fountainPick('${r}',this)">${r} 词根</div>`
          ).join('')}
        </div>
      `;
      break;
    }
    case 'gamble': {
      const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
      const words = shuffle(pool.filter(w => !G.deck.some(d=>d.en===w.en))).slice(0, 3);
      window._eventWords = words;
      panel.innerHTML = `
        <div class="event-icon">${event.emoji}</div>
        <div class="event-title">${event.name}</div>
        <div class="event-desc">${event.desc}</div>
        <div style="display:flex;gap:8px;justify-content:center;margin:12px 0">
          ${words.map(w => `<div style="padding:8px 12px;background:#16213e;border:2px solid #3a506b;font-size:13px">${w.en}<br><span style="color:var(--muted);font-size:11px">${w.cn}</span></div>`).join('')}
        </div>
        <div style="font-size:12px;color:var(--accent);margin-bottom:12px">10秒记忆时间...</div>
        <div class="event-choices">
          <div class="event-choice" onclick="gambleStart(window._eventWords)">开始挑战</div>
          <div class="event-choice" onclick="closeEvent()">跳过</div>
        </div>
      `;
      break;
    }
    case 'potion': {
      panel.innerHTML = `
        <div class="event-icon">${event.emoji}</div>
        <div class="event-title">${event.name}</div>
        <div class="event-desc">${event.desc}</div>
        <div class="event-choices">
          <div class="event-choice" onclick="drinkPotion()">饮用药水（移除2个随机单词，-10%生命）</div>
          <div class="event-choice" onclick="closeEvent()">离开</div>
        </div>
      `;
      break;
    }
    case 'merchant': {
      const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
      const words = shuffle(pool.filter(w => !G.deck.some(d=>d.en===w.en))).slice(0, 3);
      window._eventWords = words;
      panel.innerHTML = `
        <div class="event-icon">${event.emoji}</div>
        <div class="event-title">${event.name}</div>
        <div class="event-desc">${event.desc}</div>
        <div style="display:flex;gap:8px;justify-content:center;margin:12px 0">
          ${words.map(w => `<div style="padding:8px 12px;background:#16213e;border:2px solid var(--gold);font-size:13px">${w.en}<br><span style="color:var(--muted);font-size:11px">${w.cn}</span></div>`).join('')}
        </div>
        <div class="event-choices">
          <div class="event-choice" onclick="merchantDeal(window._eventWords)">接受交易（获得3张卡，接受1次考核）</div>
          <div class="event-choice" onclick="closeEvent()">婉拒</div>
        </div>
      `;
      break;
    }
  }
  
  showScreen('event-screen');
}

function scholarAnswer(selected, correct, el, isCorrect) {
  const choices = document.querySelectorAll('.event-choice');
  choices.forEach(c => c.style.pointerEvents = 'none');
  
  if (isCorrect) {
    el.style.borderColor = 'var(--green)';
    el.style.background = '#1a3a2a';
    G.hp = G.maxHp; // Full heal
    showLog('🎉 全部回复!');
  } else {
    el.style.borderColor = 'var(--accent)';
    el.style.background = '#3a1a1a';
    showLog('答错了，没有惩罚');
  }
  setTimeout(() => closeEvent(), 1500);
}

function fountainPick(root, el) {
  const choices = document.querySelectorAll('.event-choice');
  choices.forEach(c => c.style.pointerEvents = 'none');
  el.style.borderColor = 'var(--blue)';
  el.style.background = '#1a2a3a';
  
  // Apply buff: words ending with this root get +20% damage
  G.tempBuffs.push({type:'rootBuff', root: root, value: 0.2});
  showLog(`⛲ 获得词根 ${root} 的祝福`);
  setTimeout(() => closeEvent(), 1200);
}

function gambleStart(words) {
  const panel = document.getElementById('event-panel');
  panel.innerHTML = `
    <div class="event-icon">🎰</div>
    <div class="event-title">记忆之赌</div>
    <div style="display:flex;gap:8px;justify-content:center;margin:16px 0">
      ${words.map(w => `<div style="padding:12px 16px;background:#16213e;border:2px solid #3a506b;font-size:14px">${w.en}<br><span style="color:var(--muted);font-size:12px">${w.cn}</span></div>`).join('')}
    </div>
    <div id="gamble-timer" style="font-size:20px;color:var(--gold)">10</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">记住这些单词...</div>
  `;
  
  let time = 10;
  const timer = setInterval(() => {
    time--;
    document.getElementById('gamble-timer').textContent = time;
    if (time <= 0) {
      clearInterval(timer);
      // Hide and quiz
      const word = words[Math.floor(Math.random() * words.length)];
      panel.innerHTML = `
        <div class="event-icon">🎰</div>
        <div class="event-title">拼出其中一个单词!</div>
        <div style="font-size:16px;color:var(--gold);margin:12px 0">${word.cn}</div>
        <input class="quiz-input" id="gamble-input" placeholder="输入英文..." autocomplete="off" autofocus>
        <div id="gamble-result" style="margin-top:8px;font-size:14px"></div>
        <button class="pixel-btn green" style="margin-top:12px" onclick="checkGamble('${word.en}')">确认</button>
      `;
      setTimeout(() => document.getElementById('gamble-input').focus(), 100);
    }
  }, 1000);
}

function checkGamble(correct) {
  const input = document.getElementById('gamble-input').value.trim().toLowerCase();
  const result = document.getElementById('gamble-result');
  
  if (input === correct.toLowerCase()) {
    result.innerHTML = '<span style="color:var(--green)">✅ 正确! 获得奖励!</span>';
    G.atk += 5;
    G.score += 30;
    showLog('🎰 记忆之赌胜利! 攻击力 +5');
  } else {
    result.innerHTML = `<span style="color:var(--accent)">❌ 错误! 答案: ${correct}</span>`;
    G.hp = Math.max(1, G.hp - 20);
    showLog('🎰 记忆之赌失败! -20 生命');
  }
  renderHud('event-hud');
  setTimeout(() => closeEvent(), 1500);
}

function drinkPotion() {
  if (G.deck.length >= 2) {
    const removed = [];
    for (let i = 0; i < 2; i++) {
      const idx = Math.floor(Math.random() * G.deck.length);
      removed.push(G.deck.splice(idx, 1)[0]);
    }
    const hpLoss = Math.floor(G.maxHp * 0.1);
    G.hp = Math.max(1, G.hp - hpLoss);
    showLog(`🧪 移除了 ${removed.map(w=>w.en).join(', ')}，-${hpLoss} 生命`);
  } else {
    showLog('牌库不足，无法饮用');
  }
  renderHud('event-hud');
  setTimeout(() => closeEvent(), 1200);
}

function merchantDeal(words) {
  words.forEach(w => G.deck.push(w));
  showLog(`🧳 获得 ${words.length} 张单词卡，需接受考核`);

  // Quiz the first word immediately
  setTimeout(() => {
    G.pendingMaster = [words[0]];
    startMerchantQuiz(words[0], words.slice(1));
  }, 800);
}

function startMerchantQuiz(word, extraWords) {
  const overlay = document.getElementById('quiz-overlay');
  overlay.classList.add('show');
  const panel = document.getElementById('quiz-panel');
  
  const pool = WORD_POOLS[G.floorWordLevel] || WORD_POOLS[1];
  const wrongs = shuffle(pool.filter(w => w.en !== word.en)).slice(0, 3);
  const options = shuffle([word, ...wrongs]);
  
  panel.innerHTML = `
    <div class="quiz-title">🧳 商人的考核</div>
    <div class="quiz-hint">选择 "<b>${word.en}</b>" 的正确释义</div>
    <div class="quiz-options">
      ${options.map(o => `<div class="quiz-opt" onclick="merchantQuizAnswer('${o.en}','${word.en}',this)">${o.cn}</div>`).join('')}
    </div>
    <div class="quiz-result" id="quiz-result"></div>
  `;
}

function merchantQuizAnswer(selected, correct, el) {
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  
  if (selected === correct) {
    el.classList.add('correct');
    document.getElementById('quiz-result').innerHTML = '<span style="color:var(--green)">✅ 考核通过!</span>';
    G.score += 20;
  } else {
    el.classList.add('wrong');
    document.getElementById('quiz-result').innerHTML = '<span style="color:var(--accent)">❌ 考核失败!</span>';
    G.hp = Math.max(1, G.hp - 15);
  }
  
  G.pendingMaster = [];
  setTimeout(() => {
    document.getElementById('quiz-overlay').classList.remove('show');
    closeEvent();
  }, 1500);
}

function closeEvent() {
  showMapScreen();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDeckBrowse();
    document.getElementById('quiz-overlay').classList.remove('show');
  }
  if (e.key === 'd' || e.key === 'D') {
    if (document.getElementById('map-screen').classList.contains('active')) {
      openDeckBrowse();
    }
  }
});
